<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>/* Prevent theme flash: apply stored or preferred theme early */(function(){try{var s=localStorage.getItem('theme');if(s==='dark'||(!s&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');} }catch(e){} })();</script>
    <title>Contact | Angelica Andreasson</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <section class="page-header hidden">
            <h1>Get in Touch</h1>
            <p>Available for collaborations.</p>
        </section>

        <section class="contact-container hidden">
            <form class="contact-form" id="contact-form" action="mailto:angelica.andreasson1@gmail.com" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input id="name" type="text" name="name" required placeholder="Your Name">

                <label for="email">Email</label>
                <input id="email" type="email" name="email" required placeholder="your@email.com">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required placeholder="Tell me about your project..."></textarea>

                <div style="text-align:center; margin-top:1.25rem;">
                    <button type="submit" class="primary-btn">Send Message</button>
                </div>
                
                <div id="form-message" class="form-message" style="display: none; text-align: center; margin-top: 1rem; padding: 1rem; border-radius: 6px; font-weight: 500;"></div>
            </form>

            <div class="contact-footnote" style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: #888;">
                <p>Your default email client will open to send the message. This ensures your email address and message are kept secure on your device.</p>
            </div>

            <div class="contact-alt" style="text-align:center; margin-top:2.5rem;">
                <p>Or email me directly at:</p>
                <button id="contact-email-copy" class="accent-link" style="background: none; border: none; cursor: pointer; font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--accent-green); transition: all 0.3s ease;">angelica.andreasson1@gmail.com</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
