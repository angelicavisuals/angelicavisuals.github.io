<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>/* Prevent theme flash: apply stored or preferred theme early */(function(){try{var s=localStorage.getItem('theme');if(s==='dark'||(!s&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');} }catch(e){} })();</script>
    <title>Contact | Angelica Andreasson</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <noscript>
        <div class="noscript-warning">
            <i class="fas fa-exclamation-circle"></i>
            <div>
                <strong>JavaScript is disabled</strong>
                <p>This website requires JavaScript to function properly. Please enable JavaScript in your browser settings to access all features.</p>
            </div>
        </div>
    </noscript>

    <main>
        <section class="page-header hidden">
            <h1>Get in Touch</h1>
            <p>Available for collaborations.</p>
        </section>

        <section class="contact-container hidden">
            <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST">
                
                <input type="hidden" name="access_key" value="1a7cd653-9f0f-484d-bf81-65b691f89579">

                <label for="name">Name</label>
                <input id="name" type="text" name="name" autocomplete="name" required placeholder="Your Name">

                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="email" required placeholder="your@email.com">

                <label for="message">Message</label>
                <textarea id="message" name="message" autocomplete="off" rows="6" required placeholder="Tell me about your project..."></textarea>

                <input type="hidden" name="redirect" value="https://angelicavisuals.github.io/pages/contact/thanks.html">

                <div style="text-align:center; margin-top:1.25rem;">
                    <button type="submit" class="primary-btn">Send Message</button>
                </div>
                
                <div id="form-message" class="form-message" style="display: none; text-align: center; margin-top: 1rem; padding: 1rem; border-radius: 6px; font-weight: 500;"></div>
            </form>

            <div class="contact-footnote" style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: #888;">
                <p>Your message will be sent securely. I'll respond as soon as possible.</p>
            </div>

            <div class="contact-alt" style="text-align:center; margin-top:2.5rem;">
                <p>Or email me directly at:</p>
                <button id="contact-email-copy" class="accent-link" style="background: none; border: none; cursor: pointer; font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--accent-green); transition: all 0.3s ease;">angelica.andreasson1@gmail.com</button>
            </div>
        </section>
    </main>

    <!-- Shared navbar and footer are loaded via script.js -->

    <script src="../../script.js"></script>
</body>
</html>
