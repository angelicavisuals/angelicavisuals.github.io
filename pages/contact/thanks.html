<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>/* Prevent theme flash: apply stored or preferred theme early */(function(){try{var s=localStorage.getItem('theme');if(s==='dark'||(!s&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');} }catch(e){} })();</script>
    <title>Thank You | Angelica Andreasson</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <noscript>
        <div class="noscript-warning">
            <i class="fas fa-exclamation-circle"></i>

                <strong>JavaScript is disabled</strong>
                <p>This website requires JavaScript to function properly. Please enable JavaScript in your browser settings to access all features.</p>
            </div>
        </div>

    <main>
        <section class="page-header hidden">
            <h1>Message Received</h1>
            <p>Thank you for reaching out.</p>
        </section>

        <section class="contact-container hidden" style="text-align: center; padding: 3rem 2rem;">
            <div style="max-width: 600px; margin: 0 auto;">
                <div style="font-size: 4rem; color: var(--accent-green); margin-bottom: 1.5rem;">
                    <i class="fas fa-check-circle"></i>
                </div>
                
                <h2 style="margin-bottom: 1rem; font-size: 2rem;">Thank You!</h2>
                
                <p style="font-size: 1.1rem; line-height: 1.8; margin-bottom: 2rem; color: var(--text-color);">
                    I've received your message and will get back to you as soon as possible. I appreciate you taking the time to reach out.
                </p>

                <a href="../../pages/home/" class="primary-btn" style="display: inline-block; margin-right: 1rem;">Back to Home</a>
                <a href="../../pages/work/" class="primary-btn" style="display: inline-block;">View My Work</a>
            </div>
        </section>
    </main>

    <!-- Shared navbar and footer are loaded via script.js -->

    <script src="../../script.js"></script>
</body>
</html>
